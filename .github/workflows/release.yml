name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu KEYSTORE_BASE64 – APK zostanie podpisany kluczem debug."
          fi
      - name: Build release APK
        env:
          GG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PappVersion="$GITHUB_REF_NAME" --console=plain
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "gg-retro-$GITHUB_REF_NAME.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: GG Retro ${{ github.ref_name }}
          files: gg-retro-${{ github.ref_name }}.apk
          generate_release_notes: true
