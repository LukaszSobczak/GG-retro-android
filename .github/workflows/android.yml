name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GG_RETRO_REF: 4d5b13b814a51ee9a54037a2ae0b9e27eebf7764

jobs:
  protocol:
    name: Protokół + E2E z serwerem gg-retro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout gg-retro server (webs1821/gg-retro)
        uses: actions/checkout@v4
        with:
          repository: webs1821/gg-retro
          ref: ${{ env.GG_RETRO_REF }}
          path: gg-retro-server
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gg-retro-server
      - name: Build gg-retro server
        working-directory: gg-retro-server
        run: cargo build --locked -p gg-server
      - name: Start server and register test accounts
        run: python3 e2e/start_gg_retro.py gg-retro-server/target/debug/gg-retro "$RUNNER_TEMP/gg-e2e"
      - name: Protocol unit + E2E tests
        run: ./gradlew -p gg-protocol test --console=plain
      - name: GG 6.1 installer extraction test
        env:
          GG61_EXE: ${{ github.workspace }}/gg-retro-server/server/static/gg61.exe
        run: ./gradlew -p buildSrc test --console=plain
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gg-retro-server-log
          path: ${{ runner.temp }}/gg-e2e/server.log

  app:
    name: Aplikacja Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: gg-retro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
